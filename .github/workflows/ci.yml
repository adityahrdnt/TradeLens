name: TradeLens CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tradelens
          POSTGRES_USER: tradelens
          POSTGRES_PASSWORD: tradelens
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U tradelens -d tradelens"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TRADELENS_TEST_CONNECTION_STRING: "Host=localhost;Port=5433;Database=tradelens;Username=tradelens;Password=tradelens;Pooling=true;SSL Mode=Disable"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TradeLens.sln

      - name: Build
        run: dotnet build TradeLens.sln --no-restore --configuration Release

      - name: Run Domain Tests
        run: dotnet test tests/TradeLens.Domain.Tests/TradeLens.Domain.Tests.csproj --no-build --configuration Release

      - name: Run Application Tests
        run: dotnet test tests/TradeLens.Application.Tests/TradeLens.Application.Tests.csproj --no-build --configuration Release

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U tradelens -d tradelens; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready in time."
          exit 1

      - name: Run Integration Tests
        run: dotnet test tests/TradeLens.Integration.Tests/TradeLens.Integration.Tests.csproj --no-build --configuration Release
